name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Run Node.js Tests
        run: npm test

      - name: Run PHP Lifecycle & Config Audit
        run: npm run test:php

      - name: Run Ghost Binary Detection Script
        run: npm run audit
